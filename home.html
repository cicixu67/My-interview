<!DOCTYPE html>
<html>

<head>
    <title>Same School, Different Design</title>

    <style>

        body {
            margin: 0;
            padding: 60px;
            background-color: #B5B9DE;
            color: #384094;
            font-family: Georgia, serif;
        }


        

        h1 {
            font-size: 70px;
            font-weight: normal;
            line-height: 1.05;
            margin: 0;
            max-width: 800px;
        }


        

        .intro {
            font-size: 20px;
            margin-top: 25px;
            color: #384094;
            font-family: Arial, sans-serif;
        }


        

        img {
            width: 350px;
            display: block;
            margin: 50px auto;
            border-radius: 40px;
        }


        

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 500px;
            margin: 40px auto;
        }


        a {
            display: block;
            padding: 22px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 25px;
            color: #384094;
            background-color: #EEE C9E;
            transition: 0.3s;
        }


        a:hover {
            transform: translateX(10px);
        }


        

        .interview {
            background-color: #EEEC9E;
        }

        .recipe {
            background-color: #ACC17F;
        }

        .about {
            background-color: #D2BAD7;
        }

    </style>

</head>


<body>


    <h1>
        Same School,<br>
        Different Major
    </h1>


    <p class="intro">
        Two Parsons students in two different design major
    </p>


    <img src="IMG_3321.jpeg" alt="My photo">


    <div class="links">

        <a class="interview" href="index.html#interview">
            The Interview 
        </a>
    </div>


</body>

</html>
